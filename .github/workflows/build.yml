name: Build Singularity

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Windows build → .exe + .msi
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            // MSI bundler requires numeric-only MAJOR.MINOR.PATCH — strip pre-release suffix
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            conf.version = v.replace(/-.*$/, '');
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            console.log('package.json:', v, ' tauri.conf.json:', conf.version);
          "
        env:
          VERSION: ${{ github.ref_name }}

      - name: Install npm dependencies
        run: npm ci

      - name: Verify libmpv-2.dll exists
        shell: bash
        run: |
          if [ ! -f "src-tauri/resources/libmpv-2.dll" ]; then
            echo "ERROR: src-tauri/resources/libmpv-2.dll is missing."
            echo "This file must be committed via Git LFS."
            exit 1
          fi
          echo "libmpv-2.dll found: $(ls -lh src-tauri/resources/libmpv-2.dll)"

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: Rename installer artifacts
        shell: bash
        run: |
          EXE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -1)
          if [ -n "$EXE" ]; then
            VERSION=$(echo "$EXE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            mv "$EXE" "src-tauri/target/release/bundle/nsis/Singularity Setup_${VERSION}_x64-setup.exe"
          fi
          MSI=$(find src-tauri/target/release/bundle/msi -name "*.msi" | head -1)
          if [ -n "$MSI" ]; then
            VERSION=$(echo "$MSI" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            mv "$MSI" "src-tauri/target/release/bundle/msi/Singularity Setup_${VERSION}_x64.msi"
          fi

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload .msi artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Android build → .apk
  # ───────────────────────────────────────────────────────────────────────────
  build-android:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.0.12077973" --sdk_root=$ANDROID_SDK_ROOT
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = v;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
            conf.version = v.replace(/-.*$/, '');
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
            console.log('package.json:', v, ' tauri.conf.json:', conf.version);
          "
        env:
          VERSION: ${{ github.ref_name }}

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Copy Kotlin plugin files into generated Android project
        run: |
          DEST="src-tauri/gen/android/app/src/main/java/com/singularity/app"
          MPV_LIB_DEST="src-tauri/gen/android/app/src/main/java/is/xyz/mpv"
          mkdir -p "$MPV_LIB_DEST"
          cp src-tauri/android-plugin/MpvPlugin.kt "$DEST/"
          cp src-tauri/android-plugin/MPVLib.kt "$MPV_LIB_DEST/"
          echo "Plugin files copied:"
          ls -la "$DEST/"
          ls -la "$MPV_LIB_DEST/"

      - name: Copy pinned MPV native libraries
        run: |
          set -euo pipefail
          SRC="src-tauri/android-plugin/jniLibs"
          DEST="src-tauri/gen/android/app/src/main/jniLibs"
          test -d "$SRC"
          python3 - "$SRC/SHA256SUMS.txt" <<'PYEOF'
          import hashlib
          import sys
          from pathlib import Path

          sums = Path(sys.argv[1])
          failures = []
          for raw in sums.read_text().splitlines():
              if not raw.strip():
                  continue
              expected, relative = raw.split(None, 1)
              path = Path(relative.strip())
              if not path.is_file():
                  failures.append(f"missing: {path}")
                  continue
              data = path.read_bytes()
              if data.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  failures.append(f"LFS pointer not hydrated: {path}")
                  continue
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  failures.append(f"sha256 mismatch: {path} (expected {expected}, got {actual})")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print(f"Verified {len([line for line in sums.read_text().splitlines() if line.strip()])} native libraries")
          PYEOF
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC"/. "$DEST"/
          for ABI in arm64-v8a x86_64; do
            test -s "$DEST/$ABI/libmpv.so"
            test -s "$DEST/$ABI/libplayer.so"
          done
          echo "Pinned MPV libraries copied:"
          find "$DEST" -type f -printf '%p %s bytes\n' | sort

      - name: Remove desktop resources from Android bundle
        run: |
          set -euo pipefail
          CONFIG="src-tauri/gen/android/app/src/main/assets/tauri.conf.json"
          ASSET="src-tauri/gen/android/app/src/main/assets/libmpv-2.dll"
          if [ -f "$CONFIG" ]; then
          python3 - "$CONFIG" <<'PYEOF'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          config = json.loads(path.read_text())
          config.setdefault("bundle", {}).pop("resources", None)
          path.write_text(json.dumps(config, separators=(",", ":")))
          PYEOF
          fi
          rm -f "$ASSET"
          if grep -R -n -F "libmpv-2.dll" "src-tauri/gen/android/app/src/main/assets"; then
            echo "ERROR: Windows libmpv-2.dll still appears in Android assets"
            exit 1
          fi

      - name: Write MainActivity (edge-to-edge only; plugins registered from Rust)
        run: |
          MAINACTIVITY="src-tauri/gen/android/app/src/main/java/com/singularity/app/MainActivity.kt"
          cat > "$MAINACTIVITY" << 'EOF'
          package com.singularity.app

          import android.os.Bundle
          import androidx.activity.enableEdgeToEdge

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              enableEdgeToEdge()
              super.onCreate(savedInstanceState)
            }
          }
          EOF
          echo "MainActivity updated"

      - name: Patch Gradle — add JitPack repository
        run: |
          python3 - <<'PYEOF'
          import sys

          ROOT = "src-tauri/gen/android/build.gradle.kts"
          APP  = "src-tauri/gen/android/app/build.gradle.kts"

          # ── Root: add JitPack after the LAST mavenCentral() (allprojects block) ──
          root = open(ROOT).read()
          jitpack = '\n        maven { url = uri("https://jitpack.io") }'
          idx = root.rfind("mavenCentral()")
          if idx == -1:
              print("ERROR: mavenCentral() not found in root build.gradle.kts", file=sys.stderr)
              sys.exit(1)
          end = idx + len("mavenCentral()")
          root = root[:end] + jitpack + root[end:]
          open(ROOT, "w").write(root)
          print("Root Gradle patched — JitPack added")

          app = open(APP).read()

          # ── App: ensure useLegacyPackaging for jniLibs (required for vendored libmpv.so) ──
          if 'useLegacyPackaging' not in app:
              legacy_block = '\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }'
              kotlin_opts = 'kotlinOptions {'
              if kotlin_opts in app:
                  idx = app.index(kotlin_opts)
                  end = app.index('}', idx) + 1
                  app = app[:end] + legacy_block + app[end:]
                  print("App Gradle patched — useLegacyPackaging added")

          # ── App: mark release build as non-debuggable (prevents Play Protect warning) ──
          if 'isDebuggable = false' not in app and 'getByName("release")' in app:
              app = app.replace(
                  'getByName("release") {',
                  'getByName("release") {\n            isDebuggable = false'
              )
              print("App Gradle patched — isDebuggable=false added to release build type")

          open(APP, "w").write(app)

          print("\n--- Root build.gradle.kts ---")
          print(open(ROOT).read())
          print("--- App build.gradle.kts ---")
          print(open(APP).read())
          PYEOF

      - name: Patch AndroidManifest — enable cleartext HTTP
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          # Replace placeholder or false with true so HTTP streams work on real devices
          sed -i \
            's/android:usesCleartextTraffic="\${usesCleartextTraffic}"/android:usesCleartextTraffic="true"/g' \
            "$MANIFEST"
          sed -i \
            's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' \
            "$MANIFEST"
          # Confirm the attribute is present (insert if missing entirely)
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST" || \
            sed -i 's/android:theme="@style\/Theme.singularity"/android:theme="@style\/Theme.singularity"\n        android:usesCleartextTraffic="true"/' "$MANIFEST"
          # Add REQUEST_INSTALL_PACKAGES permission (needed for in-app APK updater)
          grep -q 'REQUEST_INSTALL_PACKAGES' "$MANIFEST" || \
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />|' "$MANIFEST"
          echo "--- Manifest after patch ---"
          cat "$MANIFEST"

      - name: Write gradle.properties (AndroidX + JVM args)
        run: |
          cat > src-tauri/gen/android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 --decode > "$HOME/singularity.keystore"
          echo "KEYSTORE_PATH=$HOME/singularity.keystore" >> $GITHUB_ENV

      - name: Patch Gradle — inject release signingConfig
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/patch_signing.py src-tauri/gen/android/app/build.gradle.kts

      - name: Build Tauri Android (APK, release)
        run: npm run tauri android build -- --apk --target aarch64 --target x86_64 --split-per-abi --ci
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          OUT="/tmp/singularity-apks"
          mkdir -p "$OUT"
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          python3 - "$BUILD_TOOLS/apksigner" "$OUT" <<'PYEOF'
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          apksigner = Path(sys.argv[1])
          out = Path(sys.argv[2])
          apk_root = Path("src-tauri/gen/android/app/build/outputs/apk")
          expected = {"arm64-v8a": None, "x86_64": None}

          for apk in sorted(apk_root.rglob("*.apk")):
              if "unsigned" in apk.name.lower():
                  continue
              with zipfile.ZipFile(apk) as archive:
                  names = set(archive.namelist())
              if any(name.endswith("libmpv-2.dll") for name in names):
                  raise SystemExit(f"ERROR: desktop DLL or Git LFS pointer found in {apk}")
              for name in names:
                  if name.startswith("lib/") and name.endswith(".so"):
                      with zipfile.ZipFile(apk) as archive:
                          if archive.read(name).startswith(b"version https://git-lfs.github.com/spec/v1"):
                              raise SystemExit(f"ERROR: Git LFS pointer found in {apk}: {name}")
              matches = [abi for abi in expected if f"lib/{abi}/libmpv.so" in names]
              if len(matches) != 1:
                  continue
              abi = matches[0]
              for library in ("libmpv.so", "libplayer.so"):
                  if f"lib/{abi}/{library}" not in names:
                      raise SystemExit(f"ERROR: missing lib/{abi}/{library} in {apk}")
              if expected[abi] is not None:
                  raise SystemExit(f"ERROR: multiple signed APKs found for {abi}")
              subprocess.run([str(apksigner), "verify", "--verbose", str(apk)], check=True)
              expected[abi] = apk

          missing = [abi for abi, apk in expected.items() if apk is None]
          if missing:
              print("APK candidates:")
              for apk in sorted(apk_root.rglob("*.apk")):
                  print(apk)
              raise SystemExit(f"ERROR: no signed split APK found for {', '.join(missing)}")

          for abi, apk in expected.items():
              destination = out / f"SingularityV2-{abi}.apk"
              shutil.copy2(apk, destination)
              print(f"Verified {abi}: {destination}")
          print("All Android APK checks passed")
          PYEOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-android-apk
          path: /tmp/singularity-apks/*.apk
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Create GitHub Release (only on version tags)
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: singularity-windows-exe
          path: release-assets/

      - name: Download Windows .msi
        uses: actions/download-artifact@v4
        with:
          name: singularity-windows-msi
          path: release-assets/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: singularity-android-apk
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Singularity ${{ github.ref_name }}
          body: |
            ## Singularity ${{ github.ref_name }}

            IPTV/VOD streaming player for Windows Desktop and Android.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows (installer) | `Singularity Setup_*.exe` |
            | Windows (MSI) | `Singularity Setup_*.msi` |
            | Android (ARM64) | `SingularityV2-arm64-v8a.apk` |
            | Android (x86_64) | `SingularityV2-x86_64.apk` |

            ### Install
            - **Windows**: Run the `.exe` installer or the `.msi` package
            - **Android**: Enable "Install from unknown sources", then install the `.apk`
          files: release-assets/**/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
